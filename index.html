<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkillSwap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --dark-bg: #0a0a0f; --card-bg: #12121f; --neon-cyan: #00f5d4; --neon-purple: #8338ec; --neon-pink: #ff006e; }
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html { scroll-behavior: smooth; height: auto; min-height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--dark-bg); color: #e2e8f0; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 100vh; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .perspective-container { perspective: 1200px; }
    .preserve-3d { transform-style: preserve-3d; }
    .tilt-card { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
    .tilt-card:hover { transform: rotateY(-8deg) rotateX(5deg) translateZ(20px); }
    .tilt-card::before { content: ''; position: absolute; inset: -2px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink)); border-radius: inherit; opacity: 0; transition: opacity 0.5s; z-index: -1; filter: blur(12px); }
    .tilt-card:hover::before { opacity: 0.6; }
    .glass { background: rgba(18, 18, 31, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    @keyframes orbit { 0% { transform: rotate(0deg) translateX(60px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(60px) rotate(-360deg); } }
    @keyframes modal-in { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes logo-float { 0%, 100% { transform: translateY(0) rotateX(-10deg) rotateY(15deg); } 50% { transform: translateY(-10px) rotateX(-10deg) rotateY(15deg); } }
    @keyframes arrow-bounce { 0%, 100% { transform: translateY(0); opacity: 0.6; } 50% { transform: translateY(10px); opacity: 1; } }
    @keyframes slide-in-right { 0% { transform: translateX(20px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slide-in-left { 0% { transform: translateX(-20px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes typing-dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
    .shimmer-text { background: linear-gradient(90deg, #00f5d4, #8338ec, #ff006e, #00f5d4); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 4s linear infinite; }
    .orbit-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; animation: orbit 4s linear infinite; }
    .orbit-particle:nth-child(1) { animation-duration: 3s; animation-delay: 0s; background: var(--neon-cyan); }
    .orbit-particle:nth-child(2) { animation-duration: 4s; animation-delay: -1s; background: var(--neon-purple); }
    .orbit-particle:nth-child(3) { animation-duration: 5s; animation-delay: -2s; background: var(--neon-pink); }
    .orbit-particle:nth-child(4) { animation-duration: 3.5s; animation-delay: -0.5s; background: var(--neon-cyan); }
    .orbit-particle:nth-child(5) { animation-duration: 4.5s; animation-delay: -1.5s; background: var(--neon-pink); }
    .orbit-particle:nth-child(6) { animation-duration: 6s; animation-delay: -3s; background: var(--neon-purple); }
    .btn-3d { transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05); }
    .btn-3d:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,245,212,0.2), 0 0 0 1px rgba(0,245,212,0.3); }
    .btn-3d:active { transform: translateY(0) scale(0.98); }
    .reveal { opacity: 0; transform: translateY(60px) rotateX(15deg); transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1); }
    .reveal.visible { opacity: 1; transform: translateY(0) rotateX(0deg); }
    .modal-overlay { animation: modal-in 0.3s cubic-bezier(0.23, 1, 0.32, 1); }
    .scroll-hint { animation: arrow-bounce 2s ease-in-out infinite; }
    input, textarea, select { background: rgba(18, 18, 31, 0.8); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; transition: all 0.3s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 0 3px rgba(0,245,212,0.1); }
    input::placeholder, textarea::placeholder { color: #64748b; }
    input[type="date"] { color-scheme: dark; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .grid-bg { background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 60px 60px; }
    .skill-tag { background: rgba(0,245,212,0.08); border: 1px solid rgba(0,245,212,0.2); color: #00f5d4; }
    .want-tag { background: rgba(131,56,236,0.08); border: 1px solid rgba(131,56,236,0.2); color: #a78bfa; }
    .logo-3d { animation: logo-float 4s ease-in-out infinite; transform-style: preserve-3d; }
    .logo-3d:hover { animation-play-state: paused; }
    .chat-bubble-sent { background: linear-gradient(135deg, rgba(0,245,212,0.12), rgba(131,56,236,0.12)); border: 1px solid rgba(0,245,212,0.2); border-radius: 18px 18px 4px 18px; animation: slide-in-right 0.3s ease; }
    .chat-bubble-received { background: rgba(30, 30, 50, 0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px 18px 18px 4px; animation: slide-in-left 0.3s ease; }
    .typing-indicator span { display: inline-block; width: 6px; height: 6px; background: #64748b; border-radius: 50%; margin: 0 2px; animation: typing-dot 1.4s infinite ease-in-out both; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    .notification-badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; background: #ff006e; border-radius: 50%; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: white; border: 2px solid #0a0a0f; }
    .notification-item { transition: all 0.3s ease; cursor: pointer; }
    .notification-item:hover { background: rgba(255,255,255,0.03); }
    .notification-item.unread { border-left: 2px solid #00f5d4; }
    .chat-sidebar-item { transition: all 0.2s; cursor: pointer; }
    .chat-sidebar-item:hover { background: rgba(255,255,255,0.03); }
    .chat-sidebar-item.active { background: rgba(0,245,212,0.05); border-left: 2px solid #00f5d4; }
  </style>
</head>
<body class="bg-[#0a0a0f] text-slate-200 overflow-y-auto">
  <div id="scroll-progress" class="fixed top-0 left-0 h-[2px] bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 z-[100] transition-all duration-100" style="width: 0%"></div>
  <canvas id="particles" class="fixed inset-0 pointer-events-none z-0"></canvas>
  <div id="app"></div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouseX = 0, mouseY = 0;
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 2 + 1; this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        const dx = mouseX - this.x, dy = mouseY - this.y, dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) { this.x -= dx * 0.01; this.y -= dy * 0.01; }
      }
      draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(0, 245, 212, ${this.opacity})`; ctx.fill(); }
    }
    for (let i = 0; i < 80; i++) particles.push(new Particle());
    document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 120) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(0, 245, 212, ${0.1 * (1 - dist/120)})`; ctx.lineWidth = 0.5; ctx.stroke(); }
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
    createApp({
      template: `
        <div class="relative z-10 min-h-screen">
          <nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" :class="scrollY > 50 ? 'glass' : 'bg-transparent'">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div @click="goHome" class="flex items-center gap-3 cursor-pointer group">
                <div class="relative w-10 h-10 preserve-3d" style="transform: rotateX(-10deg) rotateY(15deg);">
                  <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-lg">
                    <defs>
                      <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00f5d4"/><stop offset="100%" style="stop-color:#8338ec"/></linearGradient>
                      <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#8338ec"/><stop offset="100%" style="stop-color:#ff006e"/></linearGradient>
                      <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    </defs>
                    <path d="M20 35 L50 20 L50 30 L80 30 L80 45 L50 45 L50 55 Z" fill="url(#logoGrad1)" filter="url(#glow)" opacity="0.9"/>
                    <path d="M80 65 L50 80 L50 70 L20 70 L20 55 L50 55 L50 45 Z" fill="url(#logoGrad2)" filter="url(#glow)" opacity="0.9"/>
                    <circle cx="50" cy="50" r="6" fill="#fff" filter="url(#glow)"/>
                  </svg>
                </div>
                <span class="font-display font-bold text-xl tracking-tight group-hover:text-cyan-400 transition-colors">SkillSwap</span>
              </div>
              <div class="flex items-center gap-3">
                <template v-if="currentUser">
                  <div class="relative">
                    <button @click="showNotifications = !showNotifications" class="relative p-2 rounded-xl hover:bg-slate-800/50 transition-colors">
                      <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                      <span v-if="unreadNotifCount > 0" class="notification-badge">{{ unreadNotifCount }}</span>
                    </button>
                    <div v-if="showNotifications" class="absolute right-0 top-full mt-2 w-80 bg-[#12121f] border border-slate-700 rounded-2xl shadow-2xl overflow-hidden z-50">
                      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                        <h3 class="font-semibold text-white">Notifications</h3>
                        <button @click="markAllRead" class="text-xs text-cyan-400 hover:text-cyan-300">Mark all read</button>
                      </div>
                      <div class="max-h-80 overflow-y-auto">
                        <div v-if="notifications.length === 0" class="p-6 text-center text-slate-500 text-sm">No notifications yet</div>
                        <div v-for="notif in notifications" :key="notif.id" @click="handleNotifClick(notif)" class="notification-item p-4 border-b border-slate-800/50" :class="{ unread: !notif.read }">
                          <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" :class="notif.type === 'message' ? 'bg-cyan-500/10 text-cyan-400' : 'bg-purple-500/10 text-purple-400'">
                              <svg v-if="notif.type === 'message'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                              <svg v-else class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            </div>
                            <div class="flex-1 min-w-0">
                              <p class="text-sm text-white font-medium truncate">{{ notif.title }}</p>
                              <p class="text-xs text-slate-400 mt-0.5 line-clamp-2">{{ notif.message }}</p>
                              <p class="text-xs text-slate-600 mt-1">{{ notif.time }}</p>
                            </div>
                            <div v-if="!notif.read" class="w-2 h-2 rounded-full bg-cyan-400 shrink-0 mt-1.5"></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <button @click="openChat" class="relative p-2 rounded-xl hover:bg-slate-800/50 transition-colors">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    <span v-if="unreadChatCount > 0" class="notification-badge">{{ unreadChatCount }}</span>
                  </button>
                </template>
                <button v-if="!currentUser" @click="showSignup = true" class="btn-3d px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white text-sm font-medium">Sign Up</button>
                <button v-else @click="viewProfile(currentUser.id)" class="btn-3d px-4 py-2 rounded-xl bg-slate-800 text-slate-200 text-sm font-medium border border-slate-700">My Profile</button>
                <button v-if="currentUser" @click="logout" class="px-3 py-2 text-slate-400 hover:text-white text-sm transition-colors">Logout</button>
              </div>
            </div>
          </nav>

          <!-- LANDING -->
          <div v-if="currentView === 'landing'" class="min-h-screen flex flex-col items-center px-4 pt-32 pb-20 relative">
            <div data-parallax="0.15" class="absolute top-[15%] left-[10%] pointer-events-none"><div class="w-[500px] h-[500px] bg-purple-600/15 rounded-full blur-[120px]"></div></div>
            <div data-parallax="0.25" class="absolute top-[40%] right-[5%] pointer-events-none"><div class="w-[400px] h-[400px] bg-cyan-500/10 rounded-full blur-[100px]"></div></div>
            <div data-parallax="0.1" class="absolute bottom-[10%] left-[30%] pointer-events-none"><div class="w-[600px] h-[600px] bg-pink-500/8 rounded-full blur-[150px]"></div></div>
            <div class="hero-content text-center relative z-10 max-w-3xl mx-auto">
              <div class="logo-3d relative w-40 h-40 mx-auto mb-8 preserve-3d cursor-pointer" id="hero-logo">
                <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-2xl">
                  <defs>
                    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#00f5d4"/><stop offset="100%" style="stop-color:#8338ec"/></linearGradient>
                    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#8338ec"/><stop offset="100%" style="stop-color:#ff006e"/></linearGradient>
                    <filter id="heroGlow"><feGaussianBlur stdDeviation="4" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                  </defs>
                  <path d="M15 32 L50 15 L50 28 L85 28 L85 48 L50 48 L50 62 Z" fill="url(#heroGrad1)" filter="url(#heroGlow)" opacity="0.95"/>
                  <path d="M85 68 L50 85 L50 72 L15 72 L15 52 L50 52 L50 38 Z" fill="url(#heroGrad2)" filter="url(#heroGlow)" opacity="0.95"/>
                  <circle cx="50" cy="50" r="7" fill="#fff" filter="url(#heroGlow)"/>
                </svg>
                <div class="orbit-particle" style="top:50%;left:50%;"></div><div class="orbit-particle" style="top:50%;left:50%;"></div><div class="orbit-particle" style="top:50%;left:50%;"></div><div class="orbit-particle" style="top:50%;left:50%;"></div><div class="orbit-particle" style="top:50%;left:50%;"></div><div class="orbit-particle" style="top:50%;left:50%;"></div>
              </div>
              <h1 class="font-display text-5xl md:text-7xl font-bold mb-6 shimmer-text leading-tight">SkillSwap</h1>
              <p class="text-lg md:text-xl text-slate-400 mb-4 max-w-xl mx-auto leading-relaxed">Trade skills. Grow together. Teach what you know, learn what you don't.</p>
              <p v-if="users.length > 0" class="text-slate-500 mb-8">{{ users.length }} member{{ users.length !== 1 ? 's' : '' }} already swapping skills</p>
              <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button @click="showSignup = true" class="btn-3d px-8 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-semibold text-lg">Get Started</button>
                <button @click="goToBrowse" class="btn-3d px-8 py-4 rounded-2xl bg-slate-800 text-slate-200 font-semibold text-lg border border-slate-700 hover:border-slate-500">Browse Members</button>
              </div>
              <div class="scroll-hint mt-16"><svg class="w-6 h-6 mx-auto text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg></div>
            </div>
            <div class="w-full max-w-5xl mt-32 relative z-10">
              <h2 class="text-3xl md:text-4xl font-bold font-display text-center mb-4">How It Works</h2>
              <p class="text-slate-500 text-center mb-16 max-w-md mx-auto">Three simple steps to start trading knowledge</p>
              <div class="grid md:grid-cols-3 gap-8 perspective-container">
                <div class="reveal tilt-card relative bg-[#12121f] rounded-2xl border border-slate-800 p-8 text-center group">
                  <div class="absolute -inset-[1px] rounded-[inherit] bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 opacity-0 group-hover:opacity-40 blur-md transition-opacity duration-500 -z-10"></div>
                  <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-cyan-400/20 to-purple-500/20 flex items-center justify-center border border-cyan-500/20 group-hover:scale-110 transition-transform duration-300"><svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg></div>
                  <h3 class="text-xl font-bold text-white mb-3">Share</h3><p class="text-slate-400 leading-relaxed">Tell us what skills you have and what you want to learn.</p>
                </div>
                <div class="reveal tilt-card relative bg-[#12121f] rounded-2xl border border-slate-800 p-8 text-center group" style="transition-delay: 0.1s">
                  <div class="absolute -inset-[1px] rounded-[inherit] bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 opacity-0 group-hover:opacity-40 blur-md transition-opacity duration-500 -z-10"></div>
                  <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-purple-400/20 to-pink-500/20 flex items-center justify-center border border-purple-500/20 group-hover:scale-110 transition-transform duration-300"><svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
                  <h3 class="text-xl font-bold text-white mb-3">Match</h3><p class="text-slate-400 leading-relaxed">Browse members and find your perfect skill match.</p>
                </div>
                <div class="reveal tilt-card relative bg-[#12121f] rounded-2xl border border-slate-800 p-8 text-center group" style="transition-delay: 0.2s">
                  <div class="absolute -inset-[1px] rounded-[inherit] bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 opacity-0 group-hover:opacity-40 blur-md transition-opacity duration-500 -z-10"></div>
                  <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-pink-400/20 to-cyan-500/20 flex items-center justify-center border border-pink-500/20 group-hover:scale-110 transition-transform duration-300"><svg class="w-8 h-8 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>

                    </div>

                </div>
              </div>
            </div>
          </div>

          <div v-if="currentView === 'profile' && viewedUser" class="min-h-screen pt-24 pb-20 px-4">

                <div class="relative z-10">
                  <div class="flex items-start justify-between mb-6">
                    <div class="flex items-center gap-4">
                      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-purple-500/20 flex items-center justify-center text-2xl font-bold text-cyan-400 border border-cyan-500/20">{{ viewedUser.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase() }}</div>

                        </div>
                        <p class="text-slate-500">{{ viewedUser.age }} years old</p>
                      </div>
                    </div>
                    <button v-if="isOwnProfile" @click="toggleEdit" class="btn-3d px-4 py-2 rounded-xl bg-slate-800 text-sm font-medium border border-slate-700">{{ isEditing ? 'Cancel' : 'Edit Profile' }}</button>

                    <h3 class="text-sm font-medium text-slate-500 mb-2 uppercase tracking-wider">Bio</h3>

                    <textarea v-else v-model="editForm.bio" rows="3" class="w-full rounded-xl resize-none" placeholder="Tell us about yourself..."></textarea>
                  </div>

                    <h3 class="text-sm font-medium text-slate-500 mb-3 uppercase tracking-wider">Skills I Can Teach</h3>
                    <div v-if="!isEditing" class="flex flex-wrap gap-2"><span v-for="skill in viewedUser.skills" :key="skill" class="skill-tag px-3 py-1.5 rounded-lg text-sm font-medium">{{ skill }}</span></div>

                  </div>

                    <h3 class="text-sm font-medium text-slate-500 mb-3 uppercase tracking-wider">Skills I Want to Learn</h3>

                    <button @click="openBooking" class="btn-3d w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-semibold text-lg flex items-center justify-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>Book a Session</button>

                  </div>
                </div>
              </div>
            </div>

          <!-- BOOKING MODAL -->

            <div class="modal-overlay relative bg-[#12121f] rounded-3xl border border-slate-700 p-8 max-w-md w-full">

            </div>
          </div>

                      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-purple-500/20 flex items-center justify-center text-sm font-bold text-cyan-400 border border-cyan-500/20">{{ conv.userName.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase() }}</div>

              <div class="flex-1 flex flex-col bg-[#0d0d14]">
                <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <button @click="closeChat" class="md:hidden p-2 -ml-2 text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
                    <div v-if="activeChatUser" class="flex items-center gap-3">
                      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500/20 to-purple-500/20 flex items-center justify-center text-sm font-bold text-cyan-400 border border-cyan-500/20">{{ activeChatUser.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase() }}</div>

                    <div v-else class="text-slate-500 text-sm">Select a conversation</div>

                  <button @click="closeChat" class="hidden md:block p-2 text-slate-400 hover:text-white transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <div ref="chatMessagesRef" class="flex-1 overflow-y-auto p-4 space-y-4">

                      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-800/50 flex items-center justify-center">
                        <svg class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                      </div>
                      <p class="text-slate-500">Select a conversation to start chatting</p>
                    </div>
                  </div>
                  <template v-else>
                    <div v-for="msg in activeMessages" :key="msg.id" class="flex" :class="msg.senderId === currentUser.id ? 'justify-end' : 'justify-start'">

                      </div>

                  </template>

                    </button>
                  </form>
                </div>

            <div class="bg-[#12121f] border border-slate-700 rounded-2xl p-4 shadow-2xl flex items-start gap-3" :class="notification.type === 'success' ? 'border-cyan-500/30' : notification.type === 'message' ? 'border-purple-500/30' : 'border-red-500/30'">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" :class="notification.type === 'success' ? 'bg-cyan-500/10 text-cyan-400' : notification.type === 'message' ? 'bg-purple-500/10 text-purple-400' : 'bg-red-500/10 text-red-400'">
                <svg v-if="notification.type === 'success'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <svg v-else-if="notification.type === 'message'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <svg v-else class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <div><p class="font-medium text-white">{{ notification.title }}</p><p class="text-sm text-slate-400">{{ notification.message }}</p></div>
            </div>
          </div>
        </div>
      `,

      setup() {
        const users = ref([]);
        const currentUser = ref(null);
        const currentView = ref('landing');
        const viewedUserId = ref(null);
        const isEditing = ref(false);
        const showSignup = ref(false);
        const showBooking = ref(false);
        const searchQuery = ref('');
        const scrollY = ref(0);
        const notification = ref(null);
        const bookingPreview = ref(false);

        // Chat & Notifications
        const showChat = ref(false);
        const showNotifications = ref(false);
        const activeChatUserId = ref(null);
        const chatInput = ref('');
        const isTyping = ref(false);
        const chatMessagesRef = ref(null);
        const chatInputRef = ref(null);
        const nextMsgId = ref(1);
        const nextNotifId = ref(1);

        // Global message store: { convId: [messages] }
        const messages = ref({});
        // Global notification store: [ {id, title, message, type, read, time, forUserId, fromUserId} ]
        const notifications = ref([]);

        const signupForm = ref({ name: '', email: '', phone: '', age: '', skills: '', wants: '', bio: '' });
        const bookingForm = ref({ date: '', time: '', skill: '', message: '' });
        const editForm = ref({ name: '', bio: '', skills: '', wants: '' });
        const timeSlots = ['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', '5:00 PM', '6:00 PM', '7:00 PM'];

        const viewedUser = computed(() => users.value.find(u => u.id === viewedUserId.value));
        const isOwnProfile = computed(() => currentUser.value && viewedUser.value && currentUser.value.id === viewedUser.value.id);

        const filteredUsers = computed(() => {
          let result = users.value;
          const q = searchQuery.value.toLowerCase();
          if (q) {
            result = result.filter(u => u.name.toLowerCase().includes(q) || u.skills.some(s => s.toLowerCase().includes(q)) || u.wants.some(w => w.toLowerCase().includes(q)) || u.bio.toLowerCase().includes(q));
          }
          if (currentUser.value) {
            result = [...result].sort((a, b) => {
              const aMatch = a.skills.filter(s => currentUser.value.wants.includes(s)).length;
              const bMatch = b.skills.filter(s => currentUser.value.wants.includes(s)).length;
              return bMatch - aMatch;
            });
          }
          return result;
        });

        const activeChatUser = computed(() => users.value.find(u => u.id === activeChatUserId.value));

        const activeMessages = computed(() => {
          if (!activeChatUserId.value || !currentUser.value) return [];
          const convId = getConvId(currentUser.value.id, activeChatUserId.value);
          return messages.value[convId] || [];
        });

        const conversations = computed(() => {
          if (!currentUser.value) return [];
          const convs = [];
          Object.keys(messages.value).forEach(convId => {
            const msgs = messages.value[convId];
            if (!msgs || msgs.length === 0) return;
            // Only show conversations where current user is involved
            const ids = convId.split('_').map(Number);
            if (!ids.includes(currentUser.value.id)) return;
            const otherId = ids.find(id => id !== currentUser.value.id);
            if (!otherId) return;
            const otherUser = users.value.find(u => u.id === otherId);
            if (!otherUser) return;
            const lastMsg = msgs[msgs.length - 1];
            const unreadMsgs = msgs.filter(m => m.senderId !== currentUser.value.id && !m.read);
            convs.push({
              userId: otherUser.id,
              userName: otherUser.name,
              lastMessage: lastMsg.text,
              lastTime: lastMsg.time,
              unread: unreadMsgs.length
            });
          });
          return convs.sort((a, b) => b.lastTime.localeCompare(a.lastTime));
        });

        // Notifications for current user
        const myNotifications = computed(() => {
          if (!currentUser.value) return [];
          return notifications.value.filter(n => n.forUserId === currentUser.value.id);
        });

        const unreadNotifCount = computed(() => myNotifications.value.filter(n => !n.read).length);

        const unreadChatCount = computed(() => {
          if (!currentUser.value) return 0;
          let count = 0;
          Object.keys(messages.value).forEach(convId => {
            const ids = convId.split('_').map(Number);
            if (!ids.includes(currentUser.value.id)) return;
            const msgs = messages.value[convId];
            if (msgs) count += msgs.filter(m => m.senderId !== currentUser.value.id && !m.read).length;
          });
          return count;
        });

        function getConvId(id1, id2) {
          return [id1, id2].sort((a, b) => a - b).join('_');
        }

        function showNotify(title, message, type = 'success') {
          notification.value = { title, message, type };
          setTimeout(() => notification.value = null, 4000);
        }

        function addNotification(forUserId, title, message, type = 'booking', fromUserId = null) {
          const notif = {
            id: nextNotifId.value++,
            title,
            message,
            type,
            read: false,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            forUserId,
            fromUserId
          };
          notifications.value.push(notif);
        }

        function handleSignup() {
          const newUser = {
            id: Date.now(),
            name: signupForm.value.name,
            email: signupForm.value.email,
            phone: signupForm.value.phone,
            age: parseInt(signupForm.value.age),
            skills: signupForm.value.skills.split(',').map(s => s.trim()).filter(Boolean),
            wants: signupForm.value.wants.split(',').map(s => s.trim()).filter(Boolean),
            bio: signupForm.value.bio
          };
          users.value.push(newUser);
          currentUser.value = newUser;
          showSignup.value = false;
          signupForm.value = { name: '', email: '', phone: '', age: '', skills: '', wants: '', bio: '' };
          showNotify('Welcome!', 'Your profile has been created. Start browsing members!', 'success');
          goToBrowse();
        }

        function goHome() {
          currentView.value = 'home';
          viewedUserId.value = null;
          isEditing.value = false;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function goToBrowse() {
          currentView.value = 'home';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function viewProfile(id) {
          viewedUserId.value = id;
          currentView.value = 'profile';
          isEditing.value = false;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function toggleEdit() {
          if (isEditing.value) { isEditing.value = false; return; }
          editForm.value = { name: viewedUser.value.name, bio: viewedUser.value.bio, skills: viewedUser.value.skills.join(', '), wants: viewedUser.value.wants.join(', ') };
          isEditing.value = true;
        }

        function saveProfile() {
          const user = users.value.find(u => u.id === currentUser.value.id);
          if (user) {
            user.name = editForm.value.name; user.bio = editForm.value.bio;
            user.skills = editForm.value.skills.split(',').map(s => s.trim()).filter(Boolean);
            user.wants = editForm.value.wants.split(',').map(s => s.trim()).filter(Boolean);
            currentUser.value = { ...user };
          }
          isEditing.value = false;
          showNotify('Profile Updated', 'Your changes have been saved.', 'success');
        }

        function openBooking() {
          bookingForm.value = { date: '', time: '', skill: '', message: '' };
          bookingPreview.value = false;
          showBooking.value = true;
        }

        function confirmBooking() {
          if (!bookingForm.value.date || !bookingForm.value.time || !bookingForm.value.skill) return;
          bookingPreview.value = true;
          // Send notification to the viewed user
          addNotification(
            viewedUser.value.id,
            'New Booking Request',
            `${currentUser.value.name} wants to book a ${bookingForm.value.skill} session on ${bookingForm.value.date} at ${bookingForm.value.time}`,
            'booking',
            currentUser.value.id
          );
          showNotify('Booking Request Sent!', `We notified ${viewedUser.value.name}.`, 'success');
          setTimeout(() => { showBooking.value = false; bookingPreview.value = false; }, 3000);
        }

        // CHAT FUNCTIONS
        function openChat() {
          showChat.value = true;
          showNotifications.value = false;
        }

        function closeChat() {
          showChat.value = false;
          activeChatUserId.value = null;
        }

        function startChat(user) {
          if (!currentUser.value || user.id === currentUser.value.id) return;
          activeChatUserId.value = user.id;
          const convId = getConvId(currentUser.value.id, user.id);
          if (!messages.value[convId]) messages.value[convId] = [];
          showChat.value = true;
          showNotifications.value = false;
          nextTick(() => {
            if (chatInputRef.value) chatInputRef.value.focus();
            scrollToBottom();
          });
        }

        function selectConversation(userId) {
          activeChatUserId.value = userId;
          const convId = getConvId(currentUser.value.id, userId);
          if (messages.value[convId]) {
            messages.value[convId].forEach(m => { if (m.senderId !== currentUser.value.id) m.read = true; });
          }
          nextTick(() => {
            if (chatInputRef.value) chatInputRef.value.focus();
            scrollToBottom();
          });
        }

        function sendMessage() {
          if (!chatInput.value.trim() || !activeChatUserId.value || !currentUser.value) return;
          const convId = getConvId(currentUser.value.id, activeChatUserId.value);
          if (!messages.value[convId]) messages.value[convId] = [];

          const msg = {
            id: nextMsgId.value++,
            senderId: currentUser.value.id,
            text: chatInput.value.trim(),
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            read: false
          };
          messages.value[convId].push(msg);
          chatInput.value = '';
          scrollToBottom();

          // Simulate reply
          simulateReply(activeChatUserId.value);
        }

        function simulateReply(fromUserId) {
          isTyping.value = true;
          const delay = 1000 + Math.random() * 2000;
          setTimeout(() => {
            isTyping.value = false;
            const convId = getConvId(currentUser.value.id, fromUserId);
            const replies = [
              "Hey! That sounds great, I'd love to help with that.",
              "Sure, when works best for you?",
              "I'm available most evenings, let me know!",
              "Awesome, I've been wanting to learn that too!",
              "Let's schedule something soon.",
              "Sounds good to me!",
              "I can teach you that, no problem.",
              "When do you want to start?",
              "I've got some free time this weekend.",
              "Perfect, let's do it!"
            ];
            const replyText = replies[Math.floor(Math.random() * replies.length)];
            const replyTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const reply = {
              id: nextMsgId.value++,
              senderId: fromUserId,
              text: replyText,
              time: replyTime,
              read: false
            };

            if (!messages.value[convId]) messages.value[convId] = [];
            messages.value[convId].push(reply);

            // Send notification to current user (they received a message)
            if (!showChat.value || activeChatUserId.value !== fromUserId) {
              const sender = users.value.find(u => u.id === fromUserId);
              addNotification(currentUser.value.id, 'New Message', `${sender.name}: ${replyText}`, 'message', fromUserId);
              showNotify('New Message', `From ${sender.name}`, 'message');
            }
            scrollToBottom();
          }, delay);
        }

        function scrollToBottom() {
          nextTick(() => {
            if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
          });
        }

        function handleNotifClick(notif) {
          notif.read = true;
          showNotifications.value = false;
          if (notif.fromUserId) {
            const user = users.value.find(u => u.id === notif.fromUserId);
            if (user) {
              if (notif.type === 'message') startChat(user);
              else viewProfile(user.id);
            }
          }
        }

        function markAllRead() {
          myNotifications.value.forEach(n => n.read = true);
          Object.keys(messages.value).forEach(convId => {
            const ids = convId.split('_').map(Number);
            if (!ids.includes(currentUser.value.id)) return;
            messages.value[convId].forEach(m => { if (m.senderId !== currentUser.value.id) m.read = true; });
          });
        }

        function logout() {
          currentUser.value = null;
          currentView.value = 'landing';
          showChat.value = false;
          showNotifications.value = false;
          activeChatUserId.value = null;
          showNotify('Logged Out', 'See you next time!', 'success');
        }

        function handleScroll() {
          scrollY.value = window.scrollY;
          document.querySelectorAll('.reveal').forEach(el => {
            if (el.getBoundingClientRect().top < window.innerHeight - 80) el.classList.add('visible');
          });
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          const bar = document.getElementById('scroll-progress');
          if (bar) bar.style.width = (docHeight > 0 ? (scrollY.value / docHeight) * 100 : 0) + '%';
          document.querySelectorAll('[data-parallax]').forEach(el => {
            el.style.transform = `translateY(${-(scrollY.value * (parseFloat(el.dataset.parallax) || 0.5))}px)`;
          });
          const heroContent = document.querySelector('.hero-content');
          if (heroContent && currentView.value === 'landing') heroContent.style.opacity = Math.max(0, 1 - scrollY.value / 500);
        }

        watch(currentView, () => setTimeout(handleScroll, 100));

        onMounted(() => {
          window.addEventListener('scroll', handleScroll);
          setTimeout(handleScroll, 100);
          const logo = document.getElementById('hero-logo');
          if (logo) {
            logo.addEventListener('mousemove', (e) => {
              const rect = logo.getBoundingClientRect();
              logo.style.animationPlayState = 'paused';
              logo.style.transform = `rotateY(${15 + ((e.clientX - rect.left) / rect.width - 0.5) * 40}deg) rotateX(${-10 - ((e.clientY - rect.top) / rect.height - 0.5) * 30}deg)`;
            });
            logo.addEventListener('mouseleave', () => { logo.style.animationPlayState = 'running'; logo.style.transform = ''; });
          }
        });

        onUnmounted(() => window.removeEventListener('scroll', handleScroll));

        return {
          users, currentUser, currentView, viewedUserId, isEditing, showSignup, showBooking,
          searchQuery, scrollY, notification, bookingPreview, signupForm, bookingForm, editForm,
          timeSlots, viewedUser, isOwnProfile, filteredUsers,
          handleSignup, goHome, goToBrowse, viewProfile, toggleEdit, saveProfile,
          openBooking, confirmBooking, logout,
          // Chat & Notifications
          showChat, showNotifications, activeChatUserId, chatInput, isTyping,
          chatMessagesRef, chatInputRef,
          activeChatUser, activeMessages, conversations,
          myNotifications, unreadNotifCount, unreadChatCount,
          openChat, closeChat, startChat, selectConversation, sendMessage,
          handleNotifClick, markAllRead
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
