<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkillSwap - Trade Skills, Grow Together</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf8f5;
      --white: #ffffff;
      --gold: #c9a96e;
      --gold-light: #e8d5a3;
      --gold-dark: #a08040;
      --charcoal: #1a1a2e;
      --navy: #16213e;
      --slate: #4a5568;
      --slate-light: #718096;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
    }
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html { scroll-behavior: smooth; height: auto; min-height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 100vh;
    }
    .font-display { font-family: 'Playfair Display', serif; }
    .perspective-container { perspective: 1200px; }
    .preserve-3d { transform-style: preserve-3d; }
    .tilt-card {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .tilt-card:hover {
      transform: rotateY(-4deg) rotateX(3deg) translateZ(10px);
    }
    .tilt-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold-dark));
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: -1;
      filter: blur(8px);
    }
    .tilt-card:hover::before { opacity: 0.4; }
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes modal-in {
      0% { opacity: 0; transform: scale(0.95) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes arrow-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(8px); opacity: 1; }
    }
    @keyframes typing-dot {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #c9a96e, #e8d5a3, #a08040, #c9a96e);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    .btn-luxury {
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 4px 15px rgba(201,169,110,0.2), 0 0 0 1px rgba(201,169,110,0.1);
    }
    .btn-luxury:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201,169,110,0.3), 0 0 0 1px rgba(201,169,110,0.2);
    }
    .btn-luxury:active { transform: translateY(0) scale(0.98); }
    .btn-outline {
      transition: all 0.3s;
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
      transform: translateY(-1px);
    }
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .modal-overlay {
      animation: modal-in 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .scroll-hint { animation: arrow-bounce 2s ease-in-out infinite; }
    input, textarea, select {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--charcoal);
      transition: all 0.3s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,169,110,0.1);
    }
    input::placeholder, textarea::placeholder { color: var(--slate-light); }
    input[type="date"] { color-scheme: light; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .skill-tag {
      background: rgba(201,169,110,0.08);
      border: 1px solid rgba(201,169,110,0.2);
      color: var(--gold-dark);
    }
    .want-tag {
      background: rgba(22,33,62,0.06);
      border: 1px solid rgba(22,33,62,0.12);
      color: var(--navy);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #c9a96e 0%, #e8d5a3 50%, #a08040 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #c9a96e, #e8d5a3, #a08040);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-img {
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.12);
    }
    .chat-bubble-sent {
      background: linear-gradient(135deg, #c9a96e, #e8d5a3);
      color: white;
      border-radius: 20px 20px 4px 20px;
    }
    .chat-bubble-received {
      background: #f1f5f9;
      color: var(--charcoal);
      border-radius: 20px 20px 20px 4px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--slate-light);
      border-radius: 50%;
      animation: typing-dot 1.4s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    .notification-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 10px;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .section-divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-[#faf8f5] text-[#1a1a2e] overflow-y-auto">
  <div id="scroll-progress" class="fixed top-0 left-0 h-[2px] bg-gradient-to-r from-[#c9a96e] via-[#e8d5a3] to-[#a08040] z-[100] transition-all duration-100" style="width: 0%"></div>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
    createApp({
      template: `
        <div class="relative z-10 min-h-screen">
          <!-- Nav -->
          <nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" :class="scrollY > 50 ? 'glass shadow-sm' : 'bg-transparent'">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div @click="goHome" class="flex items-center gap-3 cursor-pointer group">
                <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center shadow-lg">
                  <svg viewBox="0 0 24 24" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                  </svg>
                </div>
                <span class="font-display font-bold text-xl tracking-tight group-hover:text-[#c9a96e] transition-colors">SkillSwap</span>
              </div>
              <div class="flex items-center gap-3">
                <!-- Chat Icon -->
                <button v-if="currentUser" @click="toggleChat" class="relative p-2 rounded-xl hover:bg-slate-100 transition-colors">
                  <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                  </svg>
                  <span v-if="totalUnreadMessages > 0" class="notification-dot">{{ totalUnreadMessages }}</span>
                </button>
                <!-- Notification Bell -->
                <button v-if="currentUser" @click="toggleNotifications" class="relative p-2 rounded-xl hover:bg-slate-100 transition-colors">
                  <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                  </svg>
                  <span v-if="unreadNotifications.length > 0" class="notification-dot">{{ unreadNotifications.length }}</span>
                </button>
                <!-- Notification Dropdown -->
                <div v-if="showNotifications && currentUser" class="absolute top-14 right-4 w-80 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[60]">
                  <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="font-semibold text-sm">Notifications</h3>
                    <button v-if="notifications.length > 0" @click="markAllRead" class="text-xs text-[#c9a96e] hover:underline">Mark all read</button>
                  </div>
                  <div v-if="notifications.length === 0" class="p-6 text-center text-slate-400 text-sm">
                    No notifications yet
                  </div>
                  <div v-else class="max-h-64 overflow-y-auto">
                    <div v-for="notif in notifications" :key="notif.id" @click="handleNotificationClick(notif)" class="p-3 border-b border-slate-50 cursor-pointer hover:bg-slate-50 transition-colors" :class="!notif.read ? 'border-l-4 border-l-[#c9a96e] bg-amber-50/30' : ''">
                      <div class="flex items-start gap-3">
                        <div class="w-2 h-2 rounded-full mt-1.5 shrink-0" :class="!notif.read ? 'bg-[#c9a96e]' : 'bg-slate-300'"></div>
                        <div>
                          <p class="text-sm font-medium text-slate-800">{{ notif.title }}</p>
                          <p class="text-xs text-slate-500 mt-0.5">{{ notif.message }}</p>
                          <p class="text-xs text-slate-400 mt-1">{{ formatTime(notif.time) }}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <button v-if="!currentUser" @click="showSignup = true" class="btn-luxury px-5 py-2.5 rounded-xl gold-gradient text-white text-sm font-semibold shadow-lg">Sign Up</button>
                <button v-else @click="viewProfile(currentUser.id)" class="btn-outline px-4 py-2.5 rounded-xl text-sm font-medium">My Profile</button>
                <button v-if="currentUser" @click="logout" class="px-3 py-2 text-slate-400 hover:text-slate-600 text-sm transition-colors">Logout</button>
              </div>
            </div>
          </nav>

          <!-- LANDING PAGE -->
          <div v-if="currentView === 'landing'" class="min-h-screen flex flex-col items-center px-4 pt-28 pb-20 relative">
            <!-- Hero Section -->
            <div class="w-full max-w-6xl mx-auto grid lg:grid-cols-2 gap-12 items-center mb-20">
              <div class="hero-content relative z-10">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-amber-50 border border-amber-100 text-[#a08040] text-sm font-medium mb-6">
                  <span class="w-2 h-2 rounded-full bg-[#c9a96e] animate-pulse"></span>
                  Trade Skills. Grow Together.
                </div>
                <h1 class="font-display text-5xl md:text-6xl lg:text-7xl font-bold mb-6 leading-[1.1]">
                  Exchange<br><span class="gold-text">Knowledge</span><br>With Experts
                </h1>
                <p class="text-lg text-slate-500 mb-8 max-w-md leading-relaxed">
                  Teach what you know, learn what you don't. Connect with professionals and grow your skills through one-on-one exchanges.
                </p>
                <div class="flex flex-col sm:flex-row gap-4">
                  <button @click="showSignup = true" class="btn-luxury px-8 py-4 rounded-2xl gold-gradient text-white font-semibold text-lg shadow-xl">Get Started</button>
                  <button @click="goToBrowse" class="btn-outline px-8 py-4 rounded-2xl text-slate-600 font-semibold text-lg bg-white">Browse Members</button>
                </div>
                <div v-if="users.length > 0" class="mt-8 flex items-center gap-4">
                  <div class="flex -space-x-3">
                    <div v-for="(u, i) in users.slice(0,4)" :key="i" class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-100 to-amber-200 border-2 border-white flex items-center justify-center text-xs font-bold text-[#a08040]">
                      {{ u.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase() }}
                    </div>
                  </div>
                  <p class="text-sm text-slate-500">{{ users.length }} professional{{ users.length !== 1 ? 's' : '' }} already swapping</p>
                </div>
              </div>
              <div class="relative">
                <img src="https://kimi-web-img.moonshot.cn/img/chronus.com/ec3988d2e333b0df398d2888bd679869f7c40590.jpg" alt="Professional mentoring session" class="hero-img w-full h-[450px] object-cover">
                <div class="absolute -bottom-6 -left-6 bg-white rounded-2xl shadow-xl p-4 border border-slate-100">
                  <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl gold-gradient flex items-center justify-center">
                      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                    </div>
                    <div>
                      <p class="font-bold text-lg">500+</p>
                      <p class="text-xs text-slate-500">Skills Exchanged</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- How It Works -->
            <div class="w-full max-w-5xl mt-20 relative z-10">
              <div class="text-center mb-16">
                <p class="text-[#c9a96e] text-sm font-semibold uppercase tracking-widest mb-3">How It Works</p>
                <h2 class="text-3xl md:text-4xl font-bold font-display mb-4">Three Simple Steps</h2>
                <div class="section-divider mx-auto"></div>
              </div>
              <div class="grid md:grid-cols-3 gap-8 perspective-container">
                <div class="reveal tilt-card relative bg-white rounded-2xl border border-slate-100 p-8 text-center shadow-sm hover:shadow-xl transition-shadow">
                  <div class="w-16 h-16 mx-auto mb-6 rounded-2xl gold-gradient flex items-center justify-center shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                  </div>
                  <h3 class="text-xl font-bold text-slate-800 mb-3">Create Profile</h3>
                  <p class="text-slate-500 leading-relaxed">Share your expertise and what you want to learn. Build your professional profile in seconds.</p>
                </div>
                <div class="reveal tilt-card relative bg-white rounded-2xl border border-slate-100 p-8 text-center shadow-sm hover:shadow-xl transition-shadow" style="transition-delay: 0.1s">
                  <div class="w-16 h-16 mx-auto mb-6 rounded-2xl gold-gradient flex items-center justify-center shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                  </div>
                  <h3 class="text-xl font-bold text-slate-800 mb-3">Find Matches</h3>
                  <p class="text-slate-500 leading-relaxed">Browse professionals and find your perfect skill match. Smart sorting puts the best fits first.</p>
                </div>
                <div class="reveal tilt-card relative bg-white rounded-2xl border border-slate-100 p-8 text-center shadow-sm hover:shadow-xl transition-shadow" style="transition-delay: 0.2s">
                  <div class="w-16 h-16 mx-auto mb-6 rounded-2xl gold-gradient flex items-center justify-center shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                  </div>
                  <h3 class="text-xl font-bold text-slate-800 mb-3">Book & Chat</h3>
                  <p class="text-slate-500 leading-relaxed">Schedule a session and start trading knowledge. Built-in chat keeps you connected.</p>
                </div>
              </div>
            </div>

            <!-- Featured Image Section -->
            <div class="w-full max-w-6xl mt-32 grid lg:grid-cols-2 gap-12 items-center reveal">
              <div class="order-2 lg:order-1">
                <p class="text-[#c9a96e] text-sm font-semibold uppercase tracking-widest mb-3">Why SkillSwap</p>
                <h2 class="text-3xl md:text-4xl font-bold font-display mb-6">Learn From Real Professionals</h2>
                <div class="section-divider mb-6"></div>
                <p class="text-slate-500 leading-relaxed mb-6">
                  Unlike traditional courses, SkillSwap connects you directly with people who have real-world experience. Learn guitar from a touring musician, coding from a startup founder, or photography from a published artist.
                </p>
                <ul class="space-y-3">
                  <li class="flex items-center gap-3 text-slate-600">
                    <div class="w-5 h-5 rounded-full bg-amber-100 flex items-center justify-center"><svg class="w-3 h-3 text-[#c9a96e]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></div>
                    No fees — trade skills directly
                  </li>
                  <li class="flex items-center gap-3 text-slate-600">
                    <div class="w-5 h-5 rounded-full bg-amber-100 flex items-center justify-center"><svg class="w-3 h-3 text-[#c9a96e]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></div>
                    Built-in messaging & scheduling
                  </li>
                  <li class="flex items-center gap-3 text-slate-600">
                    <div class="w-5 h-5 rounded-full bg-amber-100 flex items-center justify-center"><svg class="w-3 h-3 text-[#c9a96e]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg></div>
                    Smart matching based on your goals
                  </li>
                </ul>
              </div>
              <div class="order-1 lg:order-2">
                <img src="https://kimi-web-img.moonshot.cn/img/advancedandfulfilled.com/ecce728888112a796df44ac3193babadcfe70c6f.jpg" alt="One-on-one coaching" class="hero-img w-full h-[400px] object-cover">
              </div>
            </div>

            <!-- Second Image Section -->
            <div class="w-full max-w-6xl mt-32 grid lg:grid-cols-2 gap-12 items-center reveal">
              <div>
                <img src="https://kimi-web-img.moonshot.cn/img/www.mksgroup.com.au/45abaaa2279e35ce39f11b5f10c7d506e2c12ce0.png" alt="Team collaboration workshop" class="hero-img w-full h-[400px] object-cover">
              </div>
              <div>
                <p class="text-[#c9a96e] text-sm font-semibold uppercase tracking-widest mb-3">Community</p>
                <h2 class="text-3xl md:text-4xl font-bold font-display mb-6">Join a Growing Network</h2>
                <div class="section-divider mb-6"></div>
                <p class="text-slate-500 leading-relaxed mb-6">
                  SkillSwap is more than a platform — it's a community of lifelong learners. Whether you're looking to pick up a new hobby or advance your career, there's someone here ready to help.
                </p>
                <div class="grid grid-cols-3 gap-6">
                  <div class="text-center">
                    <p class="text-2xl font-bold gold-text">{{ users.length || 0 }}</p>
                    <p class="text-xs text-slate-400 mt-1">Members</p>
                  </div>
                  <div class="text-center">
                    <p class="text-2xl font-bold gold-text">{{ totalSkills }}</p>
                    <p class="text-xs text-slate-400 mt-1">Skills</p>
                  </div>
                  <div class="text-center">
                    <p class="text-2xl font-bold gold-text">{{ totalMessages }}</p>
                    <p class="text-xs text-slate-400 mt-1">Messages</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- CTA -->
            <div class="mt-32 text-center relative z-10 reveal max-w-2xl mx-auto">
              <h2 class="text-3xl md:text-4xl font-bold font-display mb-4">Ready to start swapping?</h2>
              <p class="text-slate-500 mb-8 max-w-md mx-auto">Join the community and start trading skills today. No fees, no fuss — just growth.</p>
              <button @click="showSignup = true" class="btn-luxury px-10 py-4 rounded-2xl gold-gradient text-white font-semibold text-lg shadow-xl">Create Your Profile</button>
            </div>

            <footer class="mt-32 pt-8 border-t border-slate-200 text-center text-slate-400 text-sm relative z-10">
              <div class="flex items-center justify-center gap-2 mb-2">
                <div class="w-6 h-6 rounded-lg gold-gradient flex items-center justify-center">
                  <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                  </svg>
                </div>
                <span class="font-display font-bold text-slate-600">SkillSwap</span>
              </div>
              <p>Trade skills, grow together.</p>

      setup() {
        const STORAGE_KEY = 'skillswap_data_v2';

        // Load from localStorage
        const loadData = () => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
          } catch(e) {}
          return null;
        };

        const savedData = loadData();

        const users = ref(savedData?.users || []);
        const currentUser = ref(savedData?.currentUser || null);
        const messages = ref(savedData?.messages || []);
        const notifications = ref(savedData?.notifications || []);

        const currentView = ref('landing');
        const viewedUserId = ref(null);
        const isEditing = ref(false);
        const showSignup = ref(false);
        const showBooking = ref(false);
        const showChat = ref(false);
        const showNotifications = ref(false);
        const searchQuery = ref('');
        const scrollY = ref(0);
        const notification = ref(null);
        const bookingPreview = ref(false);
        const chatUserId = ref(null);
        const chatInput = ref('');
        const isTyping = ref(false);
        const chatMessagesRef = ref(null);

        const signupForm = ref({ name: '', email: '', phone: '', age: '', skills: '', wants: '', bio: '' });
        const bookingForm = ref({ date: '', time: '', skill: '', message: '' });
        const editForm = ref({ name: '', bio: '', skills: '', wants: '' });

        const timeSlots = ['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', '5:00 PM', '6:00 PM', '7:00 PM'];

        const viewedUser = computed(() => users.value.find(u => u.id === viewedUserId.value));
        const isOwnProfile = computed(() => currentUser.value && viewedUser.value && currentUser.value.id === viewedUser.value.id);
        const chatPartner = computed(() => users.value.find(u => u.id === chatUserId.value));

        const currentChatMessages = computed(() => {
          if (!currentUser.value || !chatUserId.value) return [];
          return messages.value.filter(m => 
            (m.senderId === currentUser.value.id && m.receiverId === chatUserId.value) ||
            (m.senderId === chatUserId.value && m.receiverId === currentUser.value.id)
          ).sort((a, b) => a.time - b.time);
        });

        const chatList = computed(() => {
          if (!currentUser.value) return [];
          const convos = new Map();
          messages.value.forEach(m => {
            const otherId = m.senderId === currentUser.value.id ? m.receiverId : m.senderId;
            if (!convos.has(otherId)) {
              convos.set(otherId, { userId: otherId, lastMessage: m.text, time: m.time, unread: 0 });
            } else {
              const c = convos.get(otherId);
              if (m.time > c.time) {
                c.lastMessage = m.text;
                c.time = m.time;
              }
            }
            if (m.receiverId === currentUser.value.id && !m.read) {
              convos.get(otherId).unread++;
            }
          });
          return Array.from(convos.values()).map(c => {
            const user = users.value.find(u => u.id === c.userId);
            return { ...c, name: user?.name || 'Unknown' };
          }).sort((a, b) => b.time - a.time);
        });

        const totalUnreadMessages = computed(() => {
          if (!currentUser.value) return 0;
          return messages.value.filter(m => m.receiverId === currentUser.value.id && !m.read).length;
        });

        const unreadNotifications = computed(() => notifications.value.filter(n => !n.read && n.userId === currentUser.value?.id));

        const totalSkills = computed(() => {
          const all = new Set();
          users.value.forEach(u => u.skills.forEach(s => all.add(s)));
          return all.size;
        });

        const totalMessages = computed(() => messages.value.length);

        const filteredUsers = computed(() => {
          let result = users.value;
          const q = searchQuery.value.toLowerCase();
          if (q) {
            result = result.filter(u => 
              u.name.toLowerCase().includes(q) ||
              u.skills.some(s => s.toLowerCase().includes(q)) ||
              u.wants.some(w => w.toLowerCase().includes(q)) ||
              u.bio.toLowerCase().includes(q)
            );
          }
          if (currentUser.value) {
            result = [...result].sort((a, b) => {
              const aMatch = a.skills.filter(s => currentUser.value.wants.includes(s)).length;
              const bMatch = b.skills.filter(s => currentUser.value.wants.includes(s)).length;
              return bMatch - aMatch;
            });
          }
          return result;
        });

        // Save to localStorage
        const saveData = () => {
          const data = {
            users: users.value,
            currentUser: currentUser.value,
            messages: messages.value,
            notifications: notifications.value
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        };

        watch([users, currentUser, messages, notifications], saveData, { deep: true });

        function showNotify(title, message, type = 'success') {
          notification.value = { title, message, type };
          setTimeout(() => notification.value = null, 4000);
        }

        function formatTime(ts) {
          const d = new Date(ts);
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function handleSignup() {
          const newUser = {
            id: Date.now(),
            name: signupForm.value.name,
            email: signupForm.value.email,
            phone: signupForm.value.phone,
            age: parseInt(signupForm.value.age),
            skills: signupForm.value.skills.split(',').map(s => s.trim()).filter(Boolean),
            wants: signupForm.value.wants.split(',').map(s => s.trim()).filter(Boolean),
            bio: signupForm.value.bio
          };
          users.value.push(newUser);
          currentUser.value = newUser;
          showSignup.value = false;
          signupForm.value = { name: '', email: '', phone: '', age: '', skills: '', wants: '', bio: '' };
          showNotify('Welcome!', 'Your profile has been created. Start browsing members!', 'success');
          goToBrowse();
        }

        function goHome() {
          currentView.value = 'home';
          viewedUserId.value = null;
          isEditing.value = false;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function goToBrowse() {
          currentView.value = 'home';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function viewProfile(id) {
          viewedUserId.value = id;
          currentView.value = 'profile';
          isEditing.value = false;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function toggleEdit() {
          if (isEditing.value) {
            isEditing.value = false;
            return;
          }
          editForm.value = {
            name: viewedUser.value.name,
            bio: viewedUser.value.bio,
            skills: viewedUser.value.skills.join(', '),
            wants: viewedUser.value.wants.join(', ')
          };
          isEditing.value = true;
        }

        function saveProfile() {
          const user = users.value.find(u => u.id === currentUser.value.id);
          if (user) {
            user.name = editForm.value.name;
            user.bio = editForm.value.bio;
            user.skills = editForm.value.skills.split(',').map(s => s.trim()).filter(Boolean);
            user.wants = editForm.value.wants.split(',').map(s => s.trim()).filter(Boolean);
            currentUser.value = { ...user };
          }
          isEditing.value = false;
          showNotify('Profile Updated', 'Your changes have been saved.', 'success');
        }

        function openBooking() {
          bookingForm.value = { date: '', time: '', skill: '', message: '' };
          bookingPreview.value = false;
          showBooking.value = true;
        }

        function confirmBooking() {
          if (!bookingForm.value.date || !bookingForm.value.time || !bookingForm.value.skill) return;
          bookingPreview.value = true;
          // Add notification
          notifications.value.push({
            id: Date.now(),
            userId: viewedUser.value.id,
            title: 'New Booking Request',
            message: `${currentUser.value.name} wants to learn ${bookingForm.value.skill}`,
            read: false,
            time: Date.now(),
            type: 'booking',
            fromId: currentUser.value.id
          });
          showNotify('Booking Request Sent!', `We notified ${viewedUser.value.name}.`, 'success');
          setTimeout(() => { showBooking.value = false; bookingPreview.value = false; }, 3000);
        }

        // Chat functions
        function startChat(userId) {
          chatUserId.value = userId;
          showChat.value = true;
          showNotifications.value = false;
          // Mark messages as read
          messages.value.forEach(m => {
            if (m.senderId === userId && m.receiverId === currentUser.value?.id) m.read = true;
          });
          nextTick(() => {
            if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
          });
        }

        function openChat(userId) {
          chatUserId.value = userId;
          messages.value.forEach(m => {
            if (m.senderId === userId && m.receiverId === currentUser.value?.id) m.read = true;
          });
          nextTick(() => {
            if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
          });
        }

        function toggleChat() {
          showChat.value = !showChat.value;
          showNotifications.value = false;
          if (!showChat.value) chatUserId.value = null;
        }

        function sendMessage() {
          if (!chatInput.value.trim() || !chatUserId.value || !currentUser.value) return;
          const msg = {
            id: Date.now(),
            senderId: currentUser.value.id,
            receiverId: chatUserId.value,
            text: chatInput.value.trim(),
            time: Date.now(),
            read: false
          };
          messages.value.push(msg);
          chatInput.value = '';
          nextTick(() => {
            if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
          });
          // Simulate reply
          isTyping.value = true;
          setTimeout(() => {
            isTyping.value = false;
            const replies = [
              "That sounds great! When would you like to start?",
              "I'd be happy to help with that. What's your experience level?",
              "Sure, I can teach you that. Do you have any specific goals?",
              "Awesome! Let's schedule something. What days work for you?",
              "I'm excited to share what I know. Any questions before we begin?"
            ];
            const reply = {
              id: Date.now() + 1,
              senderId: chatUserId.value,
              receiverId: currentUser.value.id,
              text: replies[Math.floor(Math.random() * replies.length)],
              time: Date.now(),
              read: false
            };
            messages.value.push(reply);
            // Add notification
            const partner = users.value.find(u => u.id === chatUserId.value);
            notifications.value.push({
              id: Date.now() + 2,
              userId: currentUser.value.id,
              title: 'New Message',
              message: `${partner?.name || 'Someone'}: ${reply.text}`,
              read: false,
              time: Date.now(),
              type: 'message',
              fromId: chatUserId.value
            });
            if (!showChat.value) {
              showNotify('New Message', `${partner?.name || 'Someone'} sent you a message!`, 'success');
            }
            nextTick(() => {
              if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
            });
          }, 1500 + Math.random() * 2000);
        }

        // Notification functions
        function toggleNotifications() {
          showNotifications.value = !showNotifications.value;
          showChat.value = false;
        }

        function handleNotificationClick(notif) {
          notif.read = true;
          showNotifications.value = false;
          if (notif.type === 'message' || notif.type === 'booking') {
            const user = users.value.find(u => u.id === notif.fromId);
            if (user) {
              viewProfile(user.id);
            }
          }
        }

        function markAllRead() {
          notifications.value.forEach(n => { if (n.userId === currentUser.value?.id) n.read = true; });
        }

        function logout() {
          currentUser.value = null;
          currentView.value = 'landing';
          showChat.value = false;
          showNotifications.value = false;
          chatUserId.value = null;
          showNotify('Logged Out', 'See you next time!', 'success');
        }

        function handleScroll() {
          scrollY.value = window.scrollY;
          const reveals = document.querySelectorAll('.reveal');
          reveals.forEach(el => {
            const top = el.getBoundingClientRect().top;
            const visible = top < window.innerHeight - 80;
            if (visible) el.classList.add('visible');
          });
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          const progress = docHeight > 0 ? (scrollY.value / docHeight) * 100 : 0;
          const bar = document.getElementById('scroll-progress');
          if (bar) bar.style.width = progress + '%';

          const heroContent = document.querySelector('.hero-content');
          if (heroContent && currentView.value === 'landing') {
            const opacity = Math.max(0, 1 - scrollY.value / 400);
            heroContent.style.opacity = opacity;
          }
        }

        watch(currentView, () => {
          setTimeout(handleScroll, 100);
        });

        onMounted(() => {
          window.addEventListener('scroll', handleScroll);
          setTimeout(handleScroll, 100);
          // If user was logged in, go to browse
          if (currentUser.value) {
            currentView.value = 'home';
          }
        });

        onUnmounted(() => {
          window.removeEventListener('scroll', handleScroll);
        });

        return {
          users, currentUser, currentView, viewedUserId, isEditing, showSignup, showBooking, showChat, showNotifications,
          searchQuery, scrollY, notification, bookingPreview, signupForm, bookingForm, editForm,
          timeSlots, viewedUser, isOwnProfile, filteredUsers, chatUserId, chatInput, isTyping,
          chatMessagesRef, chatPartner, currentChatMessages, chatList, totalUnreadMessages,
          notifications, unreadNotifications, totalSkills, totalMessages,
          handleSignup, goHome, goToBrowse, viewProfile, toggleEdit, saveProfile,
          openBooking, confirmBooking, logout, showNotify, formatTime,
          startChat, openChat, toggleChat, sendMessage, toggleNotifications,
          handleNotificationClick, markAllRead
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
