<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkillSwap - Trade Skills, Grow Together</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f8fafb;
      --white: #ffffff;
      --teal: #0d9488;
      --teal-light: #5eead4;
      --teal-dark: #0f766e;
      --charcoal: #1e293b;
      --slate: #475569;
      --slate-light: #94a3b8;
      --border: #e2e8f0;
    }
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html { scroll-behavior: smooth; height: auto; min-height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 100vh;
    }
    .font-display { font-family: 'Playfair Display', serif; }
    .perspective-container { perspective: 1200px; }
    .tilt-card {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .tilt-card:hover {
      transform: rotateY(-4deg) rotateX(3deg) translateZ(10px);
    }
    .tilt-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, var(--teal), var(--teal-light), var(--teal-dark));
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: -1;
      filter: blur(8px);
    }
    .tilt-card:hover::before { opacity: 0.4; }
    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes modal-in {
      0% { opacity: 0; transform: scale(0.95) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes typing-dot {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #0d9488, #5eead4, #0f766e, #0d9488);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    .btn-teal {
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 4px 15px rgba(13,148,136,0.2), 0 0 0 1px rgba(13,148,136,0.1);
    }
    .btn-teal:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(13,148,136,0.3), 0 0 0 1px rgba(13,148,136,0.2);
    }
    .btn-teal:active { transform: translateY(0) scale(0.98); }
    .btn-outline {
      transition: all 0.3s;
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      border-color: var(--teal);
      color: var(--teal-dark);
      transform: translateY(-1px);
    }
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .modal-overlay {
      animation: modal-in 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    }
    input, textarea, select {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--charcoal);
      transition: all 0.3s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
    }
    input::placeholder, textarea::placeholder { color: var(--slate-light); }
    input[type="date"] { color-scheme: light; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream); }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3af; }
    .skill-tag {
      background: rgba(13,148,136,0.08);
      border: 1px solid rgba(13,148,136,0.2);
      color: var(--teal-dark);
    }
    .want-tag {
      background: rgba(30,41,59,0.06);
      border: 1px solid rgba(30,41,59,0.12);
      color: var(--charcoal);
    }
    .teal-gradient {
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #0f766e 100%);
    }
    .teal-text {
      background: linear-gradient(135deg, #0d9488, #5eead4, #0f766e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-img {
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.1);
    }
    .chat-bubble-sent {
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      color: white;
      border-radius: 20px 20px 4px 20px;
    }
    .chat-bubble-received {
      background: #f1f5f9;
      color: var(--charcoal);
      border-radius: 20px 20px 20px 4px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--slate-light);
      border-radius: 50%;
      animation: typing-dot 1.4s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    .notification-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 10px;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .section-divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--teal), var(--teal-light));
      border-radius: 2px;
    }
    .feature-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(13,148,136,0.1), rgba(20,184,166,0.1));
      border: 1px solid rgba(13,148,136,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .category-pill {
      padding: 8px 20px;
      border-radius: 100px;
      background: white;
      border: 1px solid #e2e8f0;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      transition: all 0.2s;
      cursor: pointer;
    }
    .category-pill:hover, .category-pill.active {
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(13,148,136,0.25);
    }
    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .export-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      font-family: monospace;
      font-size: 12px;
      color: #64748b;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-[#f8fafb] text-[#1e293b] overflow-y-auto">
  <div id="scroll-progress" class="fixed top-0 left-0 h-[2px] bg-gradient-to-r from-[#0d9488] via-[#14b8a6] to-[#0f766e] z-[100] transition-all duration-100" style="width: 0%"></div>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick } = Vue;
    createApp({
      template: `
        <div class="relative z-10 min-h-screen">
          <!-- Nav -->
          <nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" :class="scrollY > 50 ? 'glass shadow-sm' : 'bg-transparent'">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

                    <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                  </svg>

              <div class="flex items-center gap-2">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>

                <div v-if="showNotifications && currentUser" class="absolute top-14 right-4 w-80 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-[60]">

                    <h3 class="font-semibold text-sm">Notifications</h3>
                    <button v-if="notifications.length > 0" @click="markAllRead" class="text-xs text-[#0d9488] hover:underline">Mark all read</button>
                  </div>
                  <div v-if="notifications.length === 0" class="p-6 text-center text-slate-400 text-sm">No notifications yet</div>
                  <div v-else class="max-h-64 overflow-y-auto">
                    <div v-for="notif in notifications" :key="notif.id" @click="handleNotificationClick(notif)" class="p-3 border-b border-slate-50 cursor-pointer hover:bg-slate-50 transition-colors" :class="!notif.read ? 'border-l-4 border-l-[#0d9488] bg-teal-50/30' : ''">

                          <p class="text-sm font-medium text-slate-800">{{ notif.title }}</p>
                          <p class="text-xs text-slate-500 mt-0.5">{{ notif.message }}</p>

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <template v-if="!currentUser">
                  <button @click="showLogin = true" class="btn-outline px-5 py-2.5 rounded-xl text-sm font-medium">Log In</button>
                  <button @click="showSignup = true" class="btn-teal px-5 py-2.5 rounded-xl teal-gradient text-white text-sm font-semibold shadow-lg">Sign Up</button>

            </div>

          <div v-if="currentView === 'landing'" class="min-h-screen flex flex-col items-center px-4 pt-28 pb-20 relative">
            <div class="w-full max-w-6xl mx-auto grid lg:grid-cols-2 gap-12 items-center mb-24">
              <div class="hero-content relative z-10">

                <div class="flex flex-col sm:flex-row gap-4">

                    <div class="w-12 h-12 rounded-xl teal-gradient flex items-center justify-center">

                  </div>
                </div>
              </div>
            </div>

            <div class="w-full max-w-5xl mx-auto mb-24 reveal">
              <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8 grid grid-cols-2 md:grid-cols-4 gap-8">
                <div class="text-center">
                  <p class="stat-number">{{ allUsers.length }}</p>
                  <p class="text-sm text-slate-500 mt-1">Active Members</p>
                </div>
                <div class="text-center">
                  <p class="stat-number">{{ totalSkills }}</p>
                  <p class="text-sm text-slate-500 mt-1">Skills Listed</p>
                </div>
                <div class="text-center">
                  <p class="stat-number">{{ totalMessages }}</p>
                  <p class="text-sm text-slate-500 mt-1">Messages Sent</p>
                </div>
                <div class="text-center">
                  <p class="stat-number">{{ totalBookings }}</p>
                  <p class="text-sm text-slate-500 mt-1">Sessions Booked</p>
                </div>
              </div>
            </div>

            <div class="w-full max-w-5xl mb-24 relative z-10">
              <div class="text-center mb-16">
                <p class="text-[#0d9488] text-sm font-semibold uppercase tracking-widest mb-3">How It Works</p>

              <div class="grid md:grid-cols-3 gap-8 perspective-container">

                  <div class="w-8 h-8 rounded-full bg-teal-50 text-[#0d9488] text-sm font-bold flex items-center justify-center mx-auto mb-4">1</div>

            <div class="w-full max-w-6xl mb-24 grid lg:grid-cols-2 gap-12 items-center reveal">
              <div class="order-2 lg:order-1">

          <!-- BOOKING MODAL -->

              <button @click="showBooking = false" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>

          <!-- CHAT INTERFACE -->
          <div v-if="showChat" class="fixed inset-0 z-[70] flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" @click="showChat = false"></div>
            <div class="modal-overlay relative bg-white rounded-3xl border border-slate-100 w-full max-w-4xl h-[80vh] shadow-2xl flex overflow-hidden">
              <div class="w-72 border-r border-slate-100 flex flex-col bg-slate-50/50">
                <div class="p-4 border-b border-slate-100">
                  <h3 class="font-bold font-display text-lg text-slate-800">Messages</h3>
                </div>
                <div class="flex-1 overflow-y-auto">
                  <div v-if="chatList.length === 0" class="p-6 text-center text-slate-400 text-sm">
                    No conversations yet.<br>Visit a profile to start chatting!
                  </div>
                  <div v-for="chat in chatList" :key="chat.userId" @click="openChat(chat.userId)" class="p-3 border-b border-slate-100 cursor-pointer hover:bg-white transition-colors" :class="chatUserId === chat.userId ? 'bg-white border-l-4 border-l-[#0d9488]' : ''">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl teal-gradient flex items-center justify-center text-sm font-bold text-white shrink-0">
                        {{ chat.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase() }}
                      </div>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                          <p class="font-semibold text-sm text-slate-800 truncate">{{ chat.name }}</p>
                          <span v-if="chat.unread > 0" class="w-5 h-5 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center shrink-0">{{ chat.unread }}</span>

              </div>
              <div class="flex-1 flex flex-col bg-white">
                <div v-if="!chatUserId" class="flex-1 flex items-center justify-center text-slate-400">
                  <div class="text-center">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-50 flex items-center justify-center mb-4">
                      <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                      </svg>
                    </div>
                    <p>Select a conversation to start chatting</p>
                  </div>
                </div>
                <template v-else>
                  <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                      <div class="w-9 h-9 rounded-lg teal-gradient flex items-center justify-center text-sm font-bold text-white">
                        {{ chatPartner?.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase() }}
                      </div>
                      <div>
                        <p class="font-semibold text-sm text-slate-800">{{ chatPartner?.name }}</p>

                    <button @click="showChat = false" class="text-slate-400 hover:text-slate-600">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>

                  </div>
                  <div ref="chatMessagesRef" class="flex-1 overflow-y-auto p-4 space-y-3">

                        <p class="text-[10px] mt-1 opacity-60" :class="msg.senderId === currentUser.id ? 'text-white' : 'text-slate-400'">{{ formatTime(msg.time) }}</p>

                      <div class="chat-bubble-received px-4 py-3 flex items-center gap-1.5">

                      </div>

                  <div class="p-4 border-t border-slate-100">
                    <form @submit.prevent="sendMessage" class="flex gap-2">
                      <input v-model="chatInput" type="text" placeholder="Type a message..." class="flex-1 px-4 py-3 rounded-xl" required>
                      <button type="submit" class="btn-teal px-5 py-3 rounded-xl teal-gradient text-white shadow-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                      </button>
                    </form>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- EXPORT/SHARE MODAL -->
          <div v-if="showExport" class="fixed inset-0 z-[60] flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="showExport = false"></div>
            <div class="modal-overlay relative bg-white rounded-3xl border border-slate-100 p-8 max-w-lg w-full shadow-2xl">
              <button @click="showExport = false" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
              <h2 class="text-2xl font-bold font-display mb-2 text-slate-800">Share Your Profile</h2>
              <p class="text-slate-400 text-sm mb-6">Copy this code and send it to friends so they can see you on their device!</p>
              <div class="mb-4">
                <label class="block text-sm text-slate-500 mb-1 font-medium">Your Profile Code</label>
                <div class="export-box">{{ exportCode }}</div>
              </div>
              <button @click="copyExportCode" class="btn-teal w-full py-3 rounded-xl teal-gradient text-white font-semibold shadow-lg mb-6">
                {{ copied ? 'Copied!' : 'Copy to Clipboard' }}
              </button>
              <div class="border-t border-slate-100 pt-6">
                <label class="block text-sm text-slate-500 mb-1 font-medium">Paste Friend's Code</label>
                <textarea v-model="importCode" rows="3" class="w-full px-4 py-3 rounded-xl resize-none text-sm" placeholder="Paste their code here..."></textarea>
                <button @click="importFriend" :disabled="!importCode.trim()" class="btn-teal w-full py-3 rounded-xl teal-gradient text-white font-semibold shadow-lg mt-3 disabled:opacity-50 disabled:cursor-not-allowed">
                  Add Friend
                </button>
              </div>
            </div>
          </div>

          <!-- NOTIFICATION TOAST -->
          <div v-if="notification" class="fixed bottom-6 right-6 z-[80] max-w-sm">
            <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-2xl flex items-start gap-3" :class="notification.type === 'success' ? 'border-l-4 border-l-[#0d9488]' : 'border-l-4 border-l-red-400'">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" :class="notification.type === 'success' ? 'bg-teal-50 text-[#0d9488]' : 'bg-red-50 text-red-400'">
                <svg v-if="notification.type === 'success'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <svg v-else class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <div>
                <p class="font-semibold text-slate-800 text-sm">{{ notification.title }}</p>
                <p class="text-sm text-slate-500">{{ notification.message }}</p>
              </div>
            </div>
          </div>
        </div>
      `,

      setup() {
        const STORAGE_KEY = 'skillswap_data_v6';

        const loadData = () => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed && typeof parsed === 'object') {
                return {
                  localUsers: Array.isArray(parsed.localUsers) ? parsed.localUsers : [],
                  currentUser: parsed.currentUser || null,
                  messages: Array.isArray(parsed.messages) ? parsed.messages : [],
                  notifications: Array.isArray(parsed.notifications) ? parsed.notifications : [],
                  bookings: Array.isArray(parsed.bookings) ? parsed.bookings : []
                };
              }
            }
          } catch(e) { console.error('Load error:', e); }
          return { localUsers: [], currentUser: null, messages: [], notifications: [], bookings: [] };
        };

        const saved = loadData();

        const localUsers = ref(saved.localUsers);
        const currentUser = ref(saved.currentUser);
        const messages = ref(saved.messages);
        const notifications = ref(saved.notifications);
        const bookings = ref(saved.bookings);

        const currentView = ref('landing');
        const viewedUserId = ref(null);
        const isEditing = ref(false);
        const showSignup = ref(false);
        const showLogin = ref(false);
        const showBooking = ref(false);
        const showChat = ref(false);
        const showNotifications = ref(false);
        const showExport = ref(false);
        const searchQuery = ref('');
        const scrollY = ref(0);
        const notification = ref(null);
        const bookingPreview = ref(false);
        const chatUserId = ref(null);
        const chatInput = ref('');
        const isTyping = ref(false);
        const chatMessagesRef = ref(null);
        const exportCode = ref('');
        const importCode = ref('');
        const copied = ref(false);

        const signupForm = ref({ name: '', email: '', phone: '', age: '', skills: '', wants: '', bio: '' });
        const loginForm = ref({ email: '', password: '' });
        const bookingForm = ref({ date: '', time: '', skill: '', message: '' });
        const editForm = ref({ name: '', bio: '', skills: '', wants: '' });

        const timeSlots = ['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', '5:00 PM', '6:00 PM', '7:00 PM'];

        const allUsers = computed(() => localUsers.value);

        const viewedUser = computed(() => allUsers.value.find(u => u.id === viewedUserId.value));
        const isOwnProfile = computed(() => currentUser.value && viewedUser.value && currentUser.value.id === viewedUser.value.id);
        const chatPartner = computed(() => allUsers.value.find(u => u.id === chatUserId.value));

        const currentChatMessages = computed(() => {
          if (!currentUser.value || !chatUserId.value) return [];
          return messages.value.filter(m => 
            (m.senderId === currentUser.value.id && m.receiverId === chatUserId.value) ||
            (m.senderId === chatUserId.value && m.receiverId === currentUser.value.id)
          ).sort((a, b) => a.time - b.time);
        });

        const chatList = computed(() => {
          if (!currentUser.value) return [];
          const convos = new Map();
          messages.value.forEach(m => {
            const otherId = m.senderId === currentUser.value.id ? m.receiverId : m.senderId;
            if (!convos.has(otherId)) {
              convos.set(otherId, { userId: otherId, lastMessage: m.text, time: m.time, unread: 0 });
            } else {
              const c = convos.get(otherId);
              if (m.time > c.time) { c.lastMessage = m.text; c.time = m.time; }
            }
            if (m.receiverId === currentUser.value.id && !m.read) {
              convos.get(otherId).unread++;
            }
          });
          return Array.from(convos.values()).map(c => {
            const user = allUsers.value.find(u => u.id === c.userId);
            return { ...c, name: user?.name || 'Unknown' };
          }).sort((a, b) => b.time - a.time);
        });

        const totalUnreadMessages = computed(() => {
          if (!currentUser.value) return 0;
          return messages.value.filter(m => m.receiverId === currentUser.value.id && !m.read).length;
        });

        const unreadNotifications = computed(() => notifications.value.filter(n => !n.read && n.userId === currentUser.value?.id));

        const totalSkills = computed(() => {
          const all = new Set();
          allUsers.value.forEach(u => u.skills.forEach(s => all.add(s)));
          return all.size;
        });

        const totalMessages = computed(() => messages.value.length);
        const totalBookings = computed(() => bookings.value.length);

        const filteredUsers = computed(() => {
          let result = allUsers.value;
          const q = searchQuery.value.toLowerCase();
          if (q) {
            result = result.filter(u => 
              u.name.toLowerCase().includes(q) ||
              u.skills.some(s => s.toLowerCase().includes(q)) ||
              u.wants.some(w => w.toLowerCase().includes(q)) ||
              u.bio.toLowerCase().includes(q)
            );
          }
          if (currentUser.value) {
            result = [...result].sort((a, b) => {
              const aMatch = a.skills.filter(s => currentUser.value.wants.includes(s)).length;
              const bMatch = b.skills.filter(s => currentUser.value.wants.includes(s)).length;
              return bMatch - aMatch;
            });
          }
          return result;
        });

        const saveData = () => {
          try {
            const data = {
              localUsers: localUsers.value,
              currentUser: currentUser.value,
              messages: messages.value,
              notifications: notifications.value,
              bookings: bookings.value
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          } catch(e) { console.error('Save error:', e); }
        };

        function showNotify(title, message, type = 'success') {
          notification.value = { title, message, type };
          setTimeout(() => notification.value = null, 4000);
        }

        function formatTime(ts) {
          const d = new Date(ts);
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function handleLogin() {
          const email = loginForm.value.email.trim().toLowerCase();
          const user = localUsers.value.find(u => u.email.toLowerCase() === email);
          if (user) {
            currentUser.value = user;
            showLogin.value = false;
            loginForm.value = { email: '', password: '' };
            saveData();
            showNotify('Welcome Back!', `Good to see you, ${user.name}!`, 'success');
            goToBrowse();
          } else {
            showNotify('Account Not Found', 'No account found with that email. Try signing up instead!', 'error');
          }
        }

        function handleSignup() {
          const newUser = {
            id: Date.now(),
            name: signupForm.value.name,
            email: signupForm.value.email,
            phone: signupForm.value.phone,
            age: parseInt(signupForm.value.age),
            skills: signupForm.value.skills.split(',').map(s => s.trim()).filter(Boolean),
            wants: signupForm.value.wants.split(',').map(s => s.trim()).filter(Boolean),
            bio: signupForm.value.bio
          };
          localUsers.value.push(newUser);
          currentUser.value = newUser;
          showSignup.value = false;
          signupForm.value = { name: '', email: '', phone: '', age: '', skills: '', wants: '', bio: '' };
          saveData();
          showNotify('Welcome!', 'Your profile has been created. Start browsing members!', 'success');
          goToBrowse();
        }

        function goHome() {
          currentView.value = 'home';
          viewedUserId.value = null;
          isEditing.value = false;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function goToBrowse() {
          currentView.value = 'home';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function viewProfile(id) {
          viewedUserId.value = id;
          currentView.value = 'profile';
          isEditing.value = false;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(handleScroll, 150);
        }

        function toggleEdit() {
          if (isEditing.value) { isEditing.value = false; return; }
          editForm.value = {
            name: viewedUser.value.name,
            bio: viewedUser.value.bio,
            skills: viewedUser.value.skills.join(', '),
            wants: viewedUser.value.wants.join(', ')
          };
          isEditing.value = true;
        }

        function saveProfile() {
          const user = localUsers.value.find(u => u.id === currentUser.value.id);
          if (user) {
            user.name = editForm.value.name;
            user.bio = editForm.value.bio;
            user.skills = editForm.value.skills.split(',').map(s => s.trim()).filter(Boolean);
            user.wants = editForm.value.wants.split(',').map(s => s.trim()).filter(Boolean);
            currentUser.value = { ...user };
          }
          isEditing.value = false;
          saveData();
          showNotify('Profile Updated', 'Your changes have been saved.', 'success');
        }

        function openBooking() {
          bookingForm.value = { date: '', time: '', skill: '', message: '' };
          bookingPreview.value = false;
          showBooking.value = true;
        }

        function confirmBooking() {
          if (!bookingForm.value.date || !bookingForm.value.time || !bookingForm.value.skill) return;
          bookingPreview.value = true;
          bookings.value.push({
            id: Date.now(), fromId: currentUser.value.id, toId: viewedUser.value.id,
            skill: bookingForm.value.skill, date: bookingForm.value.date,
            time: bookingForm.value.time, message: bookingForm.value.message, timeCreated: Date.now()
          });
          notifications.value.push({
            id: Date.now(), userId: viewedUser.value.id,
            title: 'New Booking Request',
            message: `${currentUser.value.name} wants to learn ${bookingForm.value.skill}`,
            read: false, time: Date.now(), type: 'booking', fromId: currentUser.value.id
          });
          saveData();
          showNotify('Booking Request Sent!', `We notified ${viewedUser.value.name}.`, 'success');
          setTimeout(() => { showBooking.value = false; bookingPreview.value = false; }, 3000);
        }

        function startChat(userId) {
          chatUserId.value = userId;
          showChat.value = true;
          showNotifications.value = false;
          messages.value.forEach(m => {
            if (m.senderId === userId && m.receiverId === currentUser.value?.id) m.read = true;
          });
          saveData();
          nextTick(() => {
            if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
          });
        }

        function openChat(userId) {
          chatUserId.value = userId;
          messages.value.forEach(m => {
            if (m.senderId === userId && m.receiverId === currentUser.value?.id) m.read = true;
          });
          saveData();
          nextTick(() => {
            if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
          });
        }

        function toggleChat() {
          showChat.value = !showChat.value;
          showNotifications.value = false;
          if (!showChat.value) chatUserId.value = null;
        }

        function sendMessage() {
          if (!chatInput.value.trim() || !chatUserId.value || !currentUser.value) return;
          const msg = {
            id: Date.now(), senderId: currentUser.value.id, receiverId: chatUserId.value,
            text: chatInput.value.trim(), time: Date.now(), read: false
          };
          messages.value.push(msg);
          chatInput.value = '';
          saveData();
          nextTick(() => {
            if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
          });
          isTyping.value = true;
          setTimeout(() => {
            isTyping.value = false;
            const replies = [
              "That sounds great! When would you like to start?",
              "I'd be happy to help with that. What is your experience level?",
              "Sure, I can teach you that. Do you have any specific goals?",
              "Awesome! Let's schedule something. What days work for you?",
              "I am excited to share what I know. Any questions before we begin?"
            ];
            const reply = {
              id: Date.now() + 1, senderId: chatUserId.value, receiverId: currentUser.value.id,
              text: replies[Math.floor(Math.random() * replies.length)], time: Date.now(), read: false
            };
            messages.value.push(reply);
            const partner = allUsers.value.find(u => u.id === chatUserId.value);
            notifications.value.push({
              id: Date.now() + 2, userId: currentUser.value.id, title: 'New Message',
              message: `${partner?.name || 'Someone'}: ${reply.text}`,
              read: false, time: Date.now(), type: 'message', fromId: chatUserId.value
            });
            saveData();
            if (!showChat.value) {
              showNotify('New Message', `${partner?.name || 'Someone'} sent you a message!`, 'success');
            }
            nextTick(() => {
              if (chatMessagesRef.value) chatMessagesRef.value.scrollTop = chatMessagesRef.value.scrollHeight;
            });
          }, 1500 + Math.random() * 2000);
        }

        function toggleNotifications() {
          showNotifications.value = !showNotifications.value;
          showChat.value = false;
        }

        function handleNotificationClick(notif) {
          notif.read = true;
          saveData();
          showNotifications.value = false;
          if (notif.type === 'message' || notif.type === 'booking') {
            const user = allUsers.value.find(u => u.id === notif.fromId);
            if (user) viewProfile(user.id);
          }
        }

        function markAllRead() {
          notifications.value.forEach(n => { if (n.userId === currentUser.value?.id) n.read = true; });
          saveData();
        }

        function openExport() {
          if (!currentUser.value) {
            showNotify('Sign Up First', 'Create a profile to share it with friends!', 'success');
            return;
          }
          const data = JSON.stringify(currentUser.value);
          exportCode.value = btoa(data);
          showExport.value = true;
        }

        function copyExportCode() {
          navigator.clipboard.writeText(exportCode.value).then(() => {
            copied.value = true;
            setTimeout(() => copied.value = false, 2000);
          }).catch(() => {
            const el = document.createElement('textarea');
            el.value = exportCode.value;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            copied.value = true;
            setTimeout(() => copied.value = false, 2000);
          });
        }

        function importFriend() {
          try {
            const decoded = atob(importCode.value.trim());
            const friend = JSON.parse(decoded);
            if (friend && friend.id && friend.name) {
              const exists = localUsers.value.find(u => u.id === friend.id);
              if (!exists) {
                localUsers.value.push(friend);
                saveData();
                showNotify('Friend Added!', `${friend.name} has been added to your community.`, 'success');
                importCode.value = '';
                showExport.value = false;
              } else {
                showNotify('Already Added', `${friend.name} is already in your community.`, 'success');
              }
            }
          } catch(e) {
            showNotify('Invalid Code', 'The code you pasted is not valid. Please check and try again.', 'error');
          }
        }

        function logout() {
          currentUser.value = null;
          currentView.value = 'landing';
          showChat.value = false;
          showNotifications.value = false;
          chatUserId.value = null;
          saveData();
          showNotify('Logged Out', 'See you next time!', 'success');
        }

        function handleScroll() {
          scrollY.value = window.scrollY;
          const reveals = document.querySelectorAll('.reveal');
          reveals.forEach(el => {
            const top = el.getBoundingClientRect().top;
            const visible = top < window.innerHeight - 80;
            if (visible) el.classList.add('visible');
          });
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          const progress = docHeight > 0 ? (scrollY.value / docHeight) * 100 : 0;
          const bar = document.getElementById('scroll-progress');
          if (bar) bar.style.width = progress + '%';
          const heroContent = document.querySelector('.hero-content');
          if (heroContent && currentView.value === 'landing') {
            heroContent.style.opacity = Math.max(0, 1 - scrollY.value / 400);
          }
        }

        watch(currentView, () => { setTimeout(handleScroll, 100); });

        onMounted(() => {
          window.addEventListener('scroll', handleScroll);
          setTimeout(handleScroll, 100);
          if (currentUser.value) currentView.value = 'home';
        });

        onUnmounted(() => {
          window.removeEventListener('scroll', handleScroll);
        });

        return {
          localUsers, currentUser, currentView, viewedUserId, isEditing,
          showSignup, showLogin, showBooking, showChat, showNotifications, showExport,
          searchQuery, scrollY, notification, bookingPreview, signupForm, loginForm,
          bookingForm, editForm, timeSlots, viewedUser, isOwnProfile, filteredUsers,
          chatUserId, chatInput, isTyping, chatMessagesRef, chatPartner,
          currentChatMessages, chatList, totalUnreadMessages, notifications,
          unreadNotifications, totalSkills, totalMessages, totalBookings,
          allUsers, exportCode, importCode, copied,
          handleLogin, handleSignup, goHome, goToBrowse, viewProfile, toggleEdit,
          saveProfile, openBooking, confirmBooking, logout, showNotify, formatTime,
          startChat, openChat, toggleChat, sendMessage, toggleNotifications,
          handleNotificationClick, markAllRead, openExport, copyExportCode, importFriend
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
